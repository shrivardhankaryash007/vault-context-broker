[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vault-context-mcp"
version = "0.1.0"
description = "Local-first MCP context broker for compact, cited Obsidian vault context."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yash Shrivardhankar" }]
dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
vault-context = "vault_context_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_context_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
packages = ["vault_context_mcp"]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["mcp.*", "yaml.*"]
ignore_missing_imports = true
