name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      # Locked install: unpinned mcp releases changed FastMCP typing and broke mypy.
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run vault-context benchmark-retrieval
